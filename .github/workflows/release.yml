name: Build and release WixLeadBot.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('wixbot.py').read()).group(1))")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "wixbot.py says $V but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name WixLeadBot
          --icon assets/icon.ico
          --add-data "categories.json;."
          --add-data "assets;assets"
          --add-data "chrome-extension;chrome-extension"
          --collect-data tzdata
          --hidden-import duckdb --collect-binaries duckdb
          --collect-data webview --hidden-import webview.platforms.edgechromium --hidden-import clr
          gui.py

      - name: Fingerprint
        shell: bash
        run: |
          cd dist
          sha256sum WixLeadBot.exe | cut -d' ' -f1 > WixLeadBot.exe.sha256
          cat WixLeadBot.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WixLeadBot.exe
            dist/WixLeadBot.exe.sha256
          generate_release_notes: true

      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: WixLeadBot
          path: dist/
