name: Build and release WixLeadBot.exe

# Runs on every push to main. If wixbot.py has a VERSION that has no release
# yet, it builds WixLeadBot.exe on Windows and publishes release vVERSION.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('wixbot.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V already exists - nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.v.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt pyinstaller

      - name: Build
        if: steps.v.outputs.skip == 'false'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name WixLeadBot
          --icon assets/icon.ico
          --add-data "categories.json;."
          --add-data "assets;assets"
          --add-data "chrome-extension;chrome-extension"
          --collect-data tzdata
          --hidden-import duckdb --collect-binaries duckdb
          --collect-data webview --hidden-import webview.platforms.edgechromium --hidden-import clr
          gui.py

      - name: Smoke test
        if: steps.v.outputs.skip == 'false'
        shell: bash
        run: |
          ls -la dist
          test -s dist/WixLeadBot.exe

      - name: Fingerprint
        if: steps.v.outputs.skip == 'false'
        shell: bash
        run: |
          cd dist
          sha256sum WixLeadBot.exe | cut -d' ' -f1 > WixLeadBot.exe.sha256
          cat WixLeadBot.exe.sha256

      - name: Publish release
        if: steps.v.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Wix Lead Bot v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/WixLeadBot.exe
            dist/WixLeadBot.exe.sha256
          generate_release_notes: true
